<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modul 2: Pemrograman Grafis 2D Canvas - Mario Flappy</title>
    <link rel="stylesheet" href="two-pro.css">
</head>
<body>
    <h2>Pemrograman Grafis 2D - Canvas API</h2>
    <canvas id="MyCanvas" width="600" height="350"></canvas>

    <div id="controls">
        <button id="btnReplay">🔁 Main Lagi</button>
        <button id="btnQuit">⏹ Keluar</button>
        <button id="btnLeaderboard">🏆 Leaderboard</button>
    </div>

    <div id="leaderboardModal" class="modal-overlay hidden">
        <div class="modal-box">
            <h3>🏆 Leaderboard</h3>
            <div class="modal-tabs">
                <button id="tabHistory" class="tab-active">Riwayat 5 Run</button>
                <button id="tabTop3">Top 3</button>
            </div>
            <div id="leaderboardContent"></div>
            <button id="btnCloseLeaderboard">Tutup</button>
        </div>
    </div>
    <p id="hint">Klik canvas / tekan SPACE untuk mulai dan melompat</p>

    <script src="two-pro.js"></script>
</body>
</html>
